components:
  schemas:
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        id_product:
          type: integer
          writeOnly: true
        qty:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - id_product
      - product
      - qty
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
      required:
      - id
      - name
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
    PatchedPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        transaction:
          allOf:
          - $ref: '#/components/schemas/Transaction'
          readOnly: true
        id_transaction:
          type: integer
          writeOnly: true
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        change:
          type: integer
          readOnly: true
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        id_category:
          type: integer
          writeOnly: true
    PatchedTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cart'
        total:
          type: integer
          readOnly: true
    Payment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        transaction:
          allOf:
          - $ref: '#/components/schemas/Transaction'
          readOnly: true
        id_transaction:
          type: integer
          writeOnly: true
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        change:
          type: integer
          readOnly: true
      required:
      - amount
      - change
      - id
      - id_transaction
      - transaction
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        id_category:
          type: integer
          writeOnly: true
      required:
      - category
      - id
      - id_category
      - name
      - price
      - stock
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cart'
        total:
          type: integer
          readOnly: true
      required:
      - date
      - id
      - items
      - total
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
